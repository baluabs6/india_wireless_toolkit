# india_wireless_toolkit configuration
# Override any value here instead of editing module code.

redis:
  host: "localhost"
  port: 6379
  db: 0
  ttl_seconds: 3600          # how long cached results are kept
  enabled: true              # set false to always compute fresh, ignore Redis

spectrum:
  india_delicensed_mhz: 500
  full_band_mhz: 1200
  us_delicensed_mhz: 1200
  thz_band_ghz_range: [100, 300]   # illustrative 6G terahertz pilot range

infra_economics:
  n_buildings: 1000
  n_isps: 5
  fibre_capex_per_building_inr: 25000
  fwa_capex_per_building_inr: 6000
  satellite_capex_per_building_inr: 15000
  neutral_access_fee_per_building_per_year_inr: 2000
  opex_per_building_per_year_inr: 1500
  years: 5
  discount_rate: 0.10        # for NPV calculations
  # Economic life of each technology's capex. Used for the fibre's residual value
  # in the NPV and for the asset-life-adjusted three-way comparison.
  fibre_asset_life_years: 20
  fwa_asset_life_years: 7
  satellite_asset_life_years: 5
  include_terminal_value: true   # count the fibre's remaining value at the end of the horizon
  adoption_ramp: []              # e.g. [0.4, 0.7, 1.0] = share of lease revenue earned in years 1, 2, 3+

news_scraper:
  sources:
    TRAI: "https://www.trai.gov.in/notifications/press-release"
    DoT: "https://dot.gov.in/relatedlinks/press-release"
    # NOTE: PIB below is a press-release DETAIL page, not a listing, so it usually yields
    # no useful links. Replace it with a PIB listing/RSS URL for the ministry you track.
    PIB: "https://pib.gov.in/PressReleseDetail.aspx"
  keywords:
    - "spectrum"
    - "6 ghz"
    - "6ghz"
    - "wi-fi"
    - "wifi"
    - "satcom"
    - "satellite"
    - "fixed wireless"
    - "fwa"
    - "right of way"
    - "row"
    - "5g"
    - "6g"
    - "wani"
    - "broadband"
    - "tower"
  max_items_per_source: 15
  fetch_timeout_seconds: 15
  fetch_max_bytes: 3000000
  sqlite_db_path: "news_archive.db"
  dummy_data_path: "data/press_releases_sample.json"
  # Secret-shaped values below are intentionally left blank here and are
  # never meant to be filled in in this file. Set them via environment
  # variables instead (copy .env.example -> .env). See config_loader.py.
  alert_webhook_url: ""      # env override: ALERT_WEBHOOK_URL
  alert_email:
    enabled: false
    smtp_host: ""            # env override: SMTP_HOST
    smtp_port: 587           # env override: SMTP_PORT
    from_addr: ""            # env override: SMTP_FROM_ADDR
    to_addr: ""              # env override: SMTP_TO_ADDR
    smtp_user: ""            # env override: SMTP_USER
    smtp_password: ""        # env override: SMTP_PASSWORD

visualization:
  plotly_js: "cdn"           # "cdn" (needs internet when opening the dashboard) or "inline" (offline, ~3 MB)

api:
  # Requests per minute per caller for matching path prefixes (longest prefix wins).
  # Authentication: set API_KEY (and API_REQUIRE_KEY=true) in the environment.
  rate_limits:
    default: 120
    /agent/: 10
    /report/generate: 5
    /news/scrape: 5
    /news/alert: 5

paths:
  charts_dir: "charts"
  data_dir: "data"
  reports_dir: "reports"

agent:
  # Agentic AI assistant (india_wireless_toolkit/agent.py). Requires
  # `pip install anthropic` and an ANTHROPIC_API_KEY environment variable —
  # never put the API key itself here. See india_wireless_toolkit/agent.py
  # for the full tool allowlist and safety design.
  model: "claude-sonnet-4-6"
  max_turns: 6          # hard cap on tool-call round-trips per question
  max_tokens: 1500       # per-response token limit
