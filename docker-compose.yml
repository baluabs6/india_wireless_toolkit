version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  toolkit:
    build: .
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
    volumes:
      - ./charts:/app/charts
      - ./reports:/app/reports
      - ./news_archive.db:/app/news_archive.db
    command: ["all"]

volumes:
  redis_data:
