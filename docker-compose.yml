# Local development stack mirroring the Azure deployment topology:
# two independently-deployable API services + Redis for caching.
# In Azure, redis is replaced by Azure Cache for Redis (see azure/README.md)
# and each API becomes its own Azure Web App for Containers.
#
# Optional environment (e.g. in a .env file next to this file):
#   API_KEY=...            require X-API-Key on every route except /health
#   API_REQUIRE_KEY=true   refuse requests when API_KEY is not configured
#   ANTHROPIC_API_KEY=...  enables POST /agent/ask

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  analytics-api:
    build:
      context: .
      dockerfile: Dockerfile.sanic
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - PORT=8001
      - API_KEY=${API_KEY:-}
      - API_REQUIRE_KEY=${API_REQUIRE_KEY:-false}
    volumes:
      - charts:/app/charts
      - ./data:/app/data:ro

  news-api:
    build:
      context: .
      dockerfile: Dockerfile.blacksheep
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - PORT=8002
      - API_KEY=${API_KEY:-}
      - API_REQUIRE_KEY=${API_REQUIRE_KEY:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # The archive lives on a named volume. (A bind mount of ./news_archive.db breaks on a fresh
      # clone: the file is gitignored, so Docker creates a *directory* with that name.)
      - AZURE_NEWS_DB_PATH=/app/var/news_archive.db
    volumes:
      - charts:/app/charts
      - reports:/app/reports
      - news_var:/app/var
      - ./data:/app/data:ro

# Named volumes inherit the image's ownership, so the non-root container user can write to them.
volumes:
  redis_data:
  charts:
  reports:
  news_var:
