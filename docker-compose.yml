version: "3.8"

# Local development stack mirroring the Azure deployment topology:
# two independently-deployable API services + Redis for caching.
# In Azure, redis is replaced by Azure Cache for Redis (see azure/README.md)
# and each API becomes its own Azure Web App for Containers.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  analytics-api:
    build:
      context: .
      dockerfile: Dockerfile.sanic
    ports:
      - "8001:8001"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - PORT=8001
    volumes:
      - ./charts:/app/charts
      - ./data:/app/data

  news-api:
    build:
      context: .
      dockerfile: Dockerfile.blacksheep
    ports:
      - "8002:8002"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - PORT=8002
    volumes:
      - ./charts:/app/charts
      - ./reports:/app/reports
      - ./news_archive.db:/app/news_archive.db

volumes:
  redis_data:
