# Secret-leak protection for this repo.
#
# Setup (one-time, per clone):
#   pip install pre-commit detect-secrets
#   pre-commit install
#
# This scans every staged file for anything that looks like a credential
# (API keys, tokens, passwords, private keys, etc.) and blocks the commit
# if it finds one that isn't already in the .secrets.baseline allowlist.
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: package-lock.json|.*\.ipynb$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
